<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="site-nav-bar" aria-label="Site" style="max-width:none;position:fixed;top:0;left:0;right:0;z-index:1000;padding:8px 12px;font:14px/1.4 system-ui,sans-serif;background:#f3f4f6;"><a href="index.html" style="color:#1d4ed8;margin-right:16px;font-weight:700;text-decoration:none;" aria-current="page">Registration form</a><a href="fetch-data.html" style="color:#1d4ed8;margin-right:16px;">Fetch user data</a></nav>
    <form id="registration-form" novalidate>
        <h2>User Registration</h2>
        <label for="username">Username:</label>
        <input type="text" id="username" required aria-describedby="username-feedback">

        <label for="email">Email:</label>
        <input type="email" id="email" required aria-describedby="email-feedback">

        <label for="password">Password:</label>
        <input type="password" id="password" required aria-describedby="password-feedback">

        <button type="submit">Register</button>
        
        <div id="form-feedback" aria-live="polite"></div>
    </form>
    <script src="script.js"></script>
</body>
</html>
